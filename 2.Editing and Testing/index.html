<!DOCTYPE html>
<html>
<head>
    <title>Network Engineer HTML Lab</title>
    <style>
        body {
            font-family: Arial;
            background-color: #0b1f33;
            color: white;
            text-align: center;
        }

        h1 {
            color: #4fc3f7;
        }

        button {
            padding: 10px;
            margin: 10px;
            font-size: 16px;
            background-color: #1976d2;
            color: white;
            border: none;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            padding: 20px;
            background: #1b3a57;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<h1>Network Engineer Testing Lab</h1>

<p>Practice networking tools in browser</p>

<button onclick="showIP()">Get My Public IP</button>
<button onclick="simulatePing()">Simulate Ping Test</button>
<button onclick="fetchAPI()">Test API Call</button>

<div id="output">
Output will appear here
</div>

<script>

function showIP() {
    fetch("https://api.ipify.org?format=json")
    .then(response => response.json())
    .then(data => {
        document.getElementById("output").innerHTML =
        "Your Public IP: " + data.ip;
    });
}

function simulatePing() {

    let latency = Math.floor(Math.random() * 50) + 10;

    document.getElementById("output").innerHTML =
    "PING 8.8.8.8 <br>" +
    "Reply from 8.8.8.8: time=" + latency + " ms";
}

function fetchAPI() {

    fetch("https://jsonplaceholder.typicode.com/posts/1")
    .then(response => response.json())
    .then(data => {

        document.getElementById("output").innerHTML =
        "<b>API Response:</b><br>" +
        "Title: " + data.title;
    });

}

</script>

</body>
</html>

body {
    background-color : beige
}
