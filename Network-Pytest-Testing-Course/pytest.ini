[pytest]
addopts = -ra --strict-markers
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    offline: deterministic test requiring no network access
    unit: pure unit test
    contract: parser or external-interface contract test
    live: read-only test against an explicitly selected lab target
    disruptive: test that can interrupt traffic or alter state
    slow: long-running or soak test
    performance: latency, throughput, scale, or resource test
    security: authentication, authorization, encryption, or policy test
    layer1: physical-layer test
    layer2: data-link-layer test
    layer3: network-layer test
    layer4: transport-layer test
    layer5: session-layer test
    layer6: presentation-layer test
    layer7: application-layer test
    routing: routing protocol or route-policy test
    bgp: BGP-specific test
    ospf: OSPF-specific test
    isis: IS-IS-specific test
    ipv6: IPv6-specific test
    services: infrastructure service test

